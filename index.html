<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reconstruction user study</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c2330;--mut:#5d6778;--card:#fff;--line:#d9dde4;--acc:#1f6fd1;--acc-fg:#fff;--ok:#1a8a4a;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#12161d;--fg:#e8ecf2;--mut:#98a2b3;--card:#1b212b;--line:#2d3542;--acc:#5ea1ff;--acc-fg:#08121f;--ok:#46c47c;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,sans-serif;padding:16px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;margin:0}.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px}
.instr{font-weight:600;font-size:17px}
.inp{display:flex;flex-direction:column;gap:6px;align-items:center}
.inp img{max-width:100%;max-height:340px;border-radius:4px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:700px){.row{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--card)}
.opt img{width:100%;border-radius:4px;background:#fff}
.opt.sel{border-color:var(--ok)}
button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
button.pick.on{background:var(--ok);color:#fff;border-color:var(--ok)}
button.wd{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.4;cursor:default}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.err{color:var(--bad);font-size:14px}
pre{overflow:auto;background:var(--bg);padding:10px;border-radius:6px;font-size:13px}
</style></head><body><div class="wrap" id="app"></div>
<script>
const URL_='https://uokhlfbegahgmztesrts.supabase.co',KEY='sb_publishable_vIrJazIRiLn0-cBRmM2SHA_hJbMrXmL';
const N=20,M=['ours','interactvlm','milo'];
const app=document.getElementById('app');
let st=load()||{};
function load(){try{return JSON.parse(localStorage.getItem('rs_state')||'null')}catch(e){return null}}
function save(){try{localStorage.setItem('rs_state',JSON.stringify(st))}catch(e){}}
async function rpc(fn,args){const r=await fetch(URL_+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
 if(!r.ok)throw new Error((await r.text())||r.status);const t=await r.text();return t?JSON.parse(t):null}
const pad=i=>String(i+1).padStart(2,'0');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function el(h){const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild}
function render(h){app.innerHTML='';app.appendChild(el(h));return app.firstElementChild}
function intro(msg){
 const c=render('<div class="card"><h1>Reconstruction user study</h1><p>You will see '+N+' photos of a person with an animal. For each photo, three 3D reconstructions are shown. Select the one you think is the best reconstructed mesh. The order is shuffled and the reconstructions are not labelled.</p><p class="mut">You get a participant number when you start. You can withdraw at any point and your answers are then deleted and not counted.</p><div class="bar"><button class="pri" id="go">Start</button></div><div class="err" id="e">'+(msg||'')+'</div></div>');
 c.querySelector('#go').onclick=async()=>{try{const r=await rpc('new_participant');const p=Array.isArray(r)?r[0]:r;st={pid:p.pid,tok:p.tok,i:0,orders:{},picks:{}};save();page()}catch(e){c.querySelector('#e').textContent='Could not start: '+e.message}}}
async function withdraw(){try{await rpc('withdraw_participant',{p_id:st.pid,p_tok:st.tok})}catch(e){}st={};save();render('<div class="card"><h1>Withdrawn</h1><p>Your answers were deleted and will not be counted.</p><div class="bar"><button class="pri" id="r">Start over</button></div></div>').querySelector('#r').onclick=()=>intro()}
function page(){
 if(!st.pid)return intro();if(st.i>=N)return done();
 const i=st.i,k=pad(i);if(!st.orders[i]){st.orders[i]=shuffle(M);save()}
 const ord=st.orders[i],pick=st.picks[i];
 const c=render('<div class="card"><div class="bar"><span class="mut">Participant #'+st.pid+'</span><span class="mut">'+(i+1)+' / '+N+'</span></div>'+
 '<div class="instr">Select the best reconstructed mesh.</div>'+
 '<div class="inp"><img src="img/'+k+'_input.jpg" alt="Input"><span class="mut">Input</span></div>'+
 '<div class="row">'+ord.map((m,j)=>'<div class="opt'+(pick===m?' sel':'')+'"><img src="img/'+k+'_'+m+'.jpg" alt="Reconstruction '+(j+1)+'"><button class="pick'+(pick===m?' on':'')+'" data-m="'+m+'">'+(pick===m?'Selected':'Select')+'</button></div>').join('')+'</div>'+
 '<div class="bar"><button class="wd" id="wd">Withdraw</button><button class="pri" id="nx" '+(pick?'':'disabled')+'>'+(i==N-1?'Finish':'Next')+'</button></div><div class="err" id="e"></div></div>');
 c.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{st.picks[i]=b.dataset.m;save();page()});
 c.querySelector('#wd').onclick=withdraw;
 c.querySelector('#nx').onclick=async()=>{try{await rpc('submit_vote',{p_id:st.pid,p_tok:st.tok,p_item:k,p_method:st.picks[i],p_order:st.orders[i]});st.i++;save();page()}catch(e){c.querySelector('#e').textContent='Could not save: '+e.message}}}
function done(){const c=render('<div class="card"><h1>Thank you</h1><p>You are participant #'+st.pid+'. All '+N+' answers are saved.</p><div class="bar"><button class="wd" id="wd">Withdraw my answers</button></div></div>');c.querySelector('#wd').onclick=withdraw}
async function results(){const c=render('<div class="card"><h1>Results</h1><pre id="o">Loading...</pre></div>');try{const r=await rpc('results');c.querySelector('#o').textContent=JSON.stringify(r,null,2)}catch(e){c.querySelector('#o').textContent=e.message}}
if(location.hash==='#results')results();else page();
window.addEventListener('hashchange',()=>location.reload());
</script></body></html>
